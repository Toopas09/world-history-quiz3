<header><h1>📜 세계사 문제은행</h1><p>미래엔 세계사 · 문명의 형성(14쪽) ~ 비잔티움 제국의 문화(57쪽) · 총 60문항</p></header>

<script>
const D={"ox": [{"q": "진시황제는 전국을 36군으로 나누고 관리를 파견하는 군현제를 실시하였다.", "a": 1, "e": "진시황제는 봉건제 대신 <b>군현제</b>를 실시해 전국을 36군으로 나누었습니다.", "p": "25쪽"}, {"q": "한 고조 유방은 진의 군현제를 그대로 계승하여 전국에 시행하였다.", "a": 0, "e": "한 고조는 군현제와 봉건제를 절충한 <b>군국제</b>를 시행했습니다.", "p": "26쪽"}, {"q": "자이나교는 바르다마나(마하비라)가 창시하였으며 살생 금지와 무소유를 강조하였다.", "a": 1, "e": "크샤트리아 출신 <b>바르다마나</b>가 창시한 자이나교는 고행과 <b>살생 금지</b>를 강조했습니다.", "p": "33쪽"}, {"q": "아소카왕 때 대승 불교가 발달하여 사막길을 통해 동아시아로 전파되었다.", "a": 0, "e": "아소카왕 때 발달한 것은 <b>상좌부 불교</b>이고, 동남아시아로 전해졌습니다. 대승 불교는 <b>쿠샨 왕조</b> 때 발달했습니다.", "p": "34~35쪽"}, {"q": "클레이스테네스는 참주가 될 위험이 있는 인물을 투표로 추방하는 도편 추방제를 실시하였다.", "a": 1, "e": "클레이스테네스는 거주지 중심 부족제, 500인 평의회, <b>도편 추방제</b>를 실시했습니다.", "p": "45쪽"}, {"q": "로마에서는 호르텐시우스법으로 평민회의 의결이 원로원의 동의 없이도 법적 효력을 갖게 되었다.", "a": 1, "e": "<b>호르텐시우스법</b>의 내용입니다. 리키니우스법은 집정관 1명을 평민 가운데서 뽑게 한 법입니다.", "p": "48쪽"}, {"q": "사산 왕조 페르시아의 샤푸르 1세는 에데사 전투에서 로마 황제를 포로로 잡았다.", "a": 1, "e": "<b>샤푸르 1세</b>는 에데사 전투(260)에서 로마 황제를 포로로 잡았습니다.", "p": "42쪽"}, {"q": "굽타 왕조는 사산 왕조 페르시아의 침략을 받아 곧바로 멸망하였다.", "a": 0, "e": "굽타 왕조는 5세기 중엽 이후 <b>에프탈</b>의 침략으로 쇠퇴했고, 왕위를 둘러싼 내분으로 6세기 중엽에 멸망했습니다. 사산 왕조의 세력 확대로 쇠퇴한 것은 쿠샨 왕조입니다.", "p": "36쪽"}, {"q": "중세 서유럽의 봉신은 자신의 봉토 안에서 주군의 간섭 없이 재판권과 징세권을 행사할 수 있었다.", "a": 1, "e": "이런 권리를 <b>불입권</b>이라고 합니다. 주종제는 <b>쌍무적 계약</b> 관계였습니다.", "p": "53쪽"}, {"q": "고딕 양식은 두꺼운 벽과 작은 창 때문에 실내가 어두운 것이 특징이다.", "a": 0, "e": "이것은 <b>로마네스크 양식</b>(피사 대성당)의 특징입니다. 고딕 양식은 첨탑과 <b>스테인드글라스</b>가 특징입니다(샤르트르·쾰른 대성당).", "p": "55쪽"}], "mc": [{"t": "메소포타미아 문명", "p": "16~17쪽", "src": "길가메시여, 당신은 생명을 찾을 수 없을 것입니다. 신들이 인간을 만들 때 죽음도 함께 붙여 주었습니다. …… 밤낮으로 춤추며 즐기십시오. 잔치를 벌이고 기뻐하십시오.", "cite": "「길가메시 서사시」", "q": "위 자료를 남긴 문명에 대한 설명으로 옳은 것은?", "o": ["나일강의 범람을 예측하려고 태양력을 만들었다.", "시신을 미라로 만들고 「사자의 서」를 제작하였다.", "개방적인 지형 때문에 이민족 침입이 잦아 현세를 중요하게 여겼다.", "파라오가 태양신 ‘라’의 아들로 여겨져 신권 정치를 하였다.", "갑골에 점친 내용을 기록하였다."], "a": 2, "e": "자료는 수메르인의 「길가메시 서사시」입니다. 메소포타미아는 개방적인 지형이라 교역이 활발했지만 이민족 침입과 홍수도 잦아 <b>내세보다 현세</b>를 중시했습니다. ①·②·④는 이집트 문명, ⑤는 상 왕조에 대한 설명입니다."}, {"t": "함무라비 법전", "p": "16쪽", "src": "제196조 자유인의 눈을 뺀 자는 그의 눈을 뺀다.\n제198조 귀족이 평민의 눈이나 다리를 상하게 하면 은화를 바쳐야 한다.\n제205조 노예가 자유인의 뺨을 때리면 그 귀를 자른다.", "cite": "함무라비 법전", "q": "위 자료로 알 수 있는 바빌로니아 사회의 모습으로 가장 알맞은 것은?", "o": ["모든 사람이 법 앞에서 평등하였다.", "신분에 따라 형벌이 다르게 적용되었다.", "사유 재산을 인정하지 않았다.", "형벌은 주로 벌금형으로만 이루어졌다.", "혼인은 계약 없이도 효력을 가졌다."], "a": 1, "e": "같은 상해라도 자유인끼리는 ‘눈에는 눈’(<b>보복주의</b>)이지만 귀족이 평민을 해치면 은화를 내고, 노예는 더 가혹한 벌을 받습니다. 즉 <b>신분에 따른 차별</b>이 있었습니다. 제40조로 보아 사유 재산은 인정되었고, 제128조에 따르면 계약서가 없는 혼인은 무효였습니다."}, {"t": "상 왕조", "p": "19쪽", "src": "신유일에 점을 치면서 정인이 묻습니다. ○○날에 왕께서 장수 망승을 데리고 하위를 정벌하러 가실 때 도움을 받겠습니까? 묻습니다. 도움을 받지 못한다면 하위를 정벌하지 말아야 할까요?", "cite": "갑골문", "q": "위 기록을 남긴 왕조에 대한 설명으로 옳은 것은?", "o": ["왕족과 공신을 제후로 삼는 봉건제를 시행하였다.", "점을 쳐서 신의 뜻을 해석해 나랏일을 결정하는 신권 정치를 하였다.", "군현제를 실시해 전국에 관리를 파견하였다.", "덕이 있는 자가 천명을 받는다는 천명사상을 강조하였다.", "철제 농기구와 우경이 널리 보급되었다."], "a": 1, "e": "갑골문은 <b>상(은)</b> 왕조의 기록이며, 한자의 원형이 되었습니다. 상의 왕은 점으로 신의 뜻을 묻고 국가 중대사를 결정하는 <b>신권 정치</b>를 펼쳤습니다. ①·④는 주, ③은 진, ⑤는 춘추 전국 시대에 대한 설명입니다."}, {"t": "진시황제", "p": "24쪽", "src": "사관이 가지고 있는 문서 중 진(秦)의 기록이 아닌 것은 모두 태우도록 하시고, 감히 『시』, 『서』 및 제자백가의 서적을 소장하고 있으면 관에 바치게 한 후 모두 태우도록 하십시오. …… 다만, 가져도 되는 것은 ( ㉠ )에 관한 책뿐입니다.", "cite": "『사기』 「진시황본기」", "q": "㉠에 들어갈 내용으로 옳은 것은?", "o": ["유교 경전과 역사", "의약과 점복, 농사", "법률과 병법", "시가와 음악", "천문과 불교"], "a": 1, "e": "진시황제는 <b>분서갱유</b>로 사상을 통제했지만, <b>의약·점복·농사</b> 같은 실용적인 책은 소장을 허용했습니다. 이 밖에도 화폐·도량형·문자를 통일하고 <b>군현제</b>를 실시했습니다."}, {"t": "북위 효문제", "p": "27쪽", "src": "북위의 군주 탁발굉이 명령을 내려 “…… 토는 중앙의 색깔이요, 만물의 시작이니 성을 원씨(元氏)로 고쳐야 한다.”라고 하였다.", "cite": "『통감절요』", "q": "위 명령을 내린 군주의 정책으로 옳지 않은 것은?", "o": ["균전제를 시행하였다.", "평성에서 뤄양으로 수도를 옮겼다.", "조정에서 선비족의 언어와 복장을 금지하였다.", "선비족과 한족의 혼인을 장려하였다.", "9품중정제로 문벌 귀족의 관직 독점을 막았다."], "a": 4, "e": "효문제는 <b>한화 정책</b>(뤄양 천도, 선비족 언어·복장 금지, 한족식 성씨 사용, 통혼 장려)과 <b>균전제</b>를 시행했습니다. 9품중정제는 오히려 남조의 <b>문벌 귀족</b>이 고위 관직을 독점하는 수단이었으므로 ⑤는 옳지 않습니다."}, {"t": "당의 양세법", "p": "29쪽", "src": "“모든 세역을 합쳐서 돈으로 거두십시오. …… 백성들은 나이가 아니라 빈부에 따라 차등을 두어 징세하십시오. …… 여름세는 6월까지 걷고 가을세는 11월까지 거두십시오.”", "cite": "『당회요』 「조세상」", "q": "위 제도가 시행된 배경으로 가장 알맞은 것은?", "o": ["북위에서 처음 균전제가 시행되었다.", "안사의 난 이후 균전제가 무너지고 장원이 확대되었다.", "수 양제가 대운하를 건설하였다.", "한 무제가 소금과 철을 전매하였다.", "송 태조가 문치주의를 채택하였다."], "a": 1, "e": "<b>양세법</b>은 <b>안사의 난</b> 이후 균전제·조용조가 무너지고 장원이 확대되자, 양염의 건의로 시행된 제도입니다. 가구별 <b>자산에 따라</b> 여름과 가을 두 번 세금을 거두었습니다."}, {"t": "그라쿠스 형제의 개혁", "p": "49쪽", "src": "티베리우스 그라쿠스는 군대에 복무한 대중의 이익을 위해 농지법을 제출하였다. …… 그의 개혁안은 기존의 관습과 전통을 어지럽히며 분란을 초래하였다.", "cite": "카시우스 디오, 『로마사』", "q": "위 개혁이 추진된 배경으로 가장 알맞은 것은?", "o": ["평민이 호민관직과 평민회를 처음 얻었다.", "오랜 정복 전쟁으로 라티푼디움이 확대되고 자영농이 몰락하였다.", "군대가 황제를 마음대로 세우는 군인 황제 시대가 이어졌다.", "크리스트교가 국교로 선포되었다.", "디오클레티아누스가 제국을 넷으로 나누었다."], "a": 1, "e": "정복 전쟁 동안 유력자들은 노예를 부리는 대농장(<b>라티푼디움</b>)을 운영했고, 오랜 전쟁으로 <b>자영농이 몰락</b>해 도시 빈민이 되었습니다. 그래서 호민관 티베리우스 그라쿠스는 <b>농지법</b>, 가이우스 그라쿠스는 <b>곡물법</b>을 추진했지만 귀족의 반대로 실패했습니다."}, {"t": "삼두 정치", "p": "49쪽", "src": "카이사르, 크라수스, 폼페이우스는 국가를 침탈하려는 욕망에 사로잡혀 권력을 동등하게 나누어 갖는 데 합의하였다. …… 카이사르는 갈리아를, 크라수스는 아시아를, 폼페이우스는 히스파니아 지방을 장악하였다.", "cite": "플로루스, 『로마사 개요』", "q": "위 자료에 나타난 정치가 전개된 이후의 사실로 옳은 것은?", "o": ["리키니우스법으로 집정관 1명을 평민에서 뽑았다.", "12표법이 제정되었다.", "옥타비아누스가 악티움 해전에서 안토니우스를 격파하였다.", "로마가 이탈리아반도를 처음 통일하였다.", "스키피오가 한니발을 물리쳤다."], "a": 2, "e": "자료는 <b>제1차 삼두 정치</b>입니다. 이후 카이사르가 암살되었고, 제2차 삼두 정치를 거쳐 <b>옥타비아누스</b>가 <b>악티움 해전(기원전 31)</b>에서 승리하면서 사실상 제정이 시작되었습니다. 나머지 보기는 모두 삼두 정치보다 앞선 일입니다."}, {"t": "서임권 투쟁", "p": "54쪽", "src": "최근 나의 아들 하인리히 4세가 파견한 사절단이 교황청의 사순절 회의에 참석하였소. 그들은 교회와 성직자 서임권에 관한 교황의 권위를 부정하는 황제의 서한을 낭독하였소.", "cite": "아그네스 황후(하인리히 4세의 모친)", "q": "위 자료에 나타난 대립의 전개와 결과로 옳은 것은?", "o": ["황제가 교황을 아비뇽으로 옮겼다.", "교황 레오 3세가 카롤루스 대제를 황제로 대관하였다.", "황제가 파문된 뒤 카노사에서 굴복했고, 이후 보름스 협약으로 교황이 서임권을 가졌다.", "성상 숭배 금지령을 둘러싸고 교회가 동서로 나뉘었다.", "니케아 공의회에서 아리우스파가 이단으로 규정되었다."], "a": 2, "e": "교황 <b>그레고리우스 7세</b>와 황제 <b>하인리히 4세</b>는 <b>성직자 서임권</b>을 두고 대립했습니다. 파문당한 황제는 굴복했고(<b>카노사의 굴욕, 1077</b>), 이후 <b>보름스 협약(1122)</b>으로 교황이 서임권을 차지했습니다."}, {"t": "비잔티움 제국", "p": "56~57쪽", "src": "(가) 대군을 이끌고 이탈리아반도, 시칠리아, 북아프리카 일대를 평정하여 …… 로마인들을 해방시켰다. -『전쟁에 대하여』\n(나) 그 내부는 찬란한 빛의 향연으로 충만하며 …… 이곳을 더욱 돋보이게 하는 것은 바로 거대한 반구형의 돔이다. -『건축물들에 대하여』", "cite": "프로코피우스", "q": "(가), (나)와 관련된 황제의 업적으로 옳은 것을 모두 고르면?\n\nㄱ. 『유스티니아누스 법전』 편찬\nㄴ. 성 소피아 성당 건립\nㄷ. 밀라노 칙령으로 크리스트교 공인\nㄹ. 서로마 황제로 대관", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 0, "e": "두 자료 모두 <b>유스티니아누스 황제</b> 때의 일입니다. 그는 옛 로마 영토의 상당 부분을 되찾고, <b>『유스티니아누스 법전』</b>을 편찬했으며, 로마의 바실리카 양식과 페르시아의 돔 양식을 합친 <b>성 소피아 성당</b>을 세웠습니다. ㄷ은 콘스탄티누스 대제, ㄹ은 카롤루스 대제의 일입니다."}, {"t": "제자백가", "p": "24쪽", "src": "백성의 본성은 힘든 것을 싫어하고 편안한 것을 좋아한다. …… 그러므로 군주는 상과 벌을 공정하게 시행해야 한다.", "cite": "『한비자』", "q": "위 주장을 펼친 사상에 대한 설명으로 옳은 것은?", "o": ["인(仁)과 예(禮)를 통한 도덕 정치를 주장하였다.", "무위자연을 내세워 인위적인 제도를 비판하였다.", "엄격한 법과 형벌로 나라를 다스려야 한다고 보았으며, 진의 통치 이념이 되었다.", "차별 없는 사랑(겸애)과 전쟁 반대를 주장하였다.", "덕으로 백성을 복종시키는 왕도 정치를 강조하였다."], "a": 2, "e": "상과 벌을 강조한 <b>한비자</b>는 <b>법가</b>를 집대성했습니다. 진은 법가를 받아들여 중국을 통일했습니다. ①은 유가(공자), ②는 도가(노자), ④는 묵가, ⑤는 맹자에 대한 설명입니다."}, {"t": "한 고조와 흉노", "p": "26쪽", "src": "묵특 선우가 정예 병사 40만 기를 풀어 백등산에서 고제(高帝)를 7일 동안 포위하였다. …… 이후 한은 흉노에 공주를 보내고 해마다 비단과 술, 곡식을 바치며 화친을 맺었다.", "cite": "『사기』 「흉노열전」", "q": "위 자료에 나타난 황제가 시행한 정책으로 옳은 것은?", "o": ["오경박사를 두고 유학을 관학으로 삼았다.", "군현제와 봉건제를 절충한 군국제를 시행하였다.", "소금과 철을 국가가 전매하였다.", "토지를 국유화하고 노비 매매를 금지하였다.", "분서갱유로 사상을 통제하였다."], "a": 1, "e": "한 <b>고조(유방)</b>는 백등산에서 흉노에게 포위된 뒤 화친을 맺었고, <b>군국제</b>를 시행했습니다. ①·③은 무제, ④는 왕망, ⑤는 진시황제의 정책입니다."}, {"t": "한 무제", "p": "26쪽", "src": "지방에서 세금으로 거둔 물자를 부족한 지방으로 옮겨 팔게 하였다(균수법). 또 물가가 쌀 때 사들였다가 비쌀 때 팔아 물가를 조절하였다(평준법).", "cite": "교과서 본문 재구성", "q": "위 정책을 시행한 황제의 업적으로 옳은 것은?", "o": ["장건을 대월지에 파견하였다.", "후한을 세우고 뤄양으로 수도를 옮겼다.", "평성에서 뤄양으로 천도하였다.", "36군을 설치하였다.", "제지술을 개량하였다."], "a": 0, "e": "<b>균수법·평준법</b>은 한 <b>무제</b>의 재정 정책입니다. 무제는 흉노를 견제하려고 <b>장건</b>을 대월지에 보냈고, 남월과 고조선을 정복했으며, 소금·철·술을 전매했습니다. ②는 광무제, ③은 효문제, ④는 진시황제, ⑤는 채륜입니다."}, {"t": "남조의 귀족 문화", "p": "29쪽", "src": "돌아가련다. 전원이 황폐해지려 하는데 어찌 돌아가지 않으리오. …… 관리가 되어도 마음이 몸의 부림을 받았으니 어찌 슬퍼하며 홀로 서러워하리오.", "cite": "도연명, 「귀거래사」", "q": "위 작품이 쓰인 시기 강남 지역의 문화에 대한 설명으로 옳은 것은?", "o": ["윈강·룽먼 석굴이 만들어졌다.", "노장사상의 영향으로 청담이 유행하였다.", "이백과 두보가 활약하였다.", "공영달이 『오경정의』를 편찬하였다.", "당삼채가 유행하였다."], "a": 1, "e": "도연명은 <b>남조</b>의 귀족 문화를 대표하는 시인입니다. 남조에서는 <b>노장사상</b>이 유행해 속세를 떠난 철학적 대화인 <b>청담</b>이 성행했고, 고개지의 「여사잠도」도 이때 그려졌습니다. ①은 북조, ③·④·⑤는 당에 해당합니다."}, {"t": "수의 대운하", "p": "29쪽", "src": "대업 원년(605) 하남의 여러 군에서 백만여 명을 징발하여 통제거를 열었다. …… 4년(608)에는 하북의 여러 군에서 백만여 명을 징발하여 영제거를 열었다.", "cite": "『통전』", "q": "위 사업을 추진한 왕조에 대한 설명으로 옳은 것은?", "o": ["시험으로 관리를 뽑는 과거제를 시행하였다.", "9품중정제를 처음 시행하였다.", "안사의 난으로 쇠퇴하였다.", "양세법을 시행하였다.", "흉노와 백등산에서 싸웠다."], "a": 0, "e": "<b>수 양제</b>가 강남과 화북을 잇는 <b>대운하</b>를 건설했습니다. 수 문제는 남북조를 통일(589)하고 <b>과거제</b>를 시행했습니다. ③·④는 당, ⑤는 한에 해당합니다. 무리한 고구려 원정과 토목 공사로 수는 일찍 멸망했습니다."}, {"t": "당의 균전제", "p": "30쪽", "src": "무릇 정남(丁男)과 18세 이상의 중남(中男)에게는 각각 1경의 토지를 지급하되, 그중 20무는 영업전으로 하고 나머지는 구분전으로 한다.", "cite": "『구당서』", "q": "위 제도를 운영한 왕조의 통치 체제로 옳은 것은?", "o": ["군국제를 실시하였다.", "3성 6부와 주현제로 국가를 운영하였다.", "9품중정제로 문벌 귀족이 관직을 독점하였다.", "균수법과 평준법을 실시하였다.", "총독을 파견하고 ‘왕의 눈’으로 감시하였다."], "a": 1, "e": "<b>당</b>은 균전제를 바탕으로 조용조와 부병제를 운영하고, <b>율령</b>에 따라 <b>3성 6부</b>와 주현제를 갖추었습니다. ①·④는 한, ③은 위진 남북조, ⑤는 아케메네스 왕조 페르시아에 해당합니다."}, {"t": "당의 국제적 문화", "p": "31쪽", "src": "태종 때 대진국의 아라본이 경전을 가지고 장안에 이르렀다. 황제가 재상 방현령을 보내 맞아들이게 하고, 경전을 번역하게 하였다.", "cite": "「대진경교유행중국비」", "q": "위 비석이 세워진 왕조에서 볼 수 있는 모습으로 옳은 것은?", "o": ["현장이 인도에서 가져온 불경을 한문으로 번역하였다.", "사마천이 『사기』를 저술하였다.", "고개지가 「여사잠도」를 그렸다.", "아소카왕의 석주가 세워졌다.", "채륜이 제지술을 개량하였다."], "a": 0, "e": "<b>당</b>은 개방적인 국제 문화를 누렸습니다. 경교(네스토리우스파 크리스트교)와 마니교가 전래되었고, 승려 <b>현장</b>은 인도에서 불교를 연구한 뒤 돌아와 경전을 번역했습니다. ②·⑤는 한, ③은 남조, ④는 마우리아 왕조입니다."}, {"t": "헤이안 시대", "p": "31쪽", "src": "9세기 말 외래 문물을 일본의 풍습에 맞게 소화하려는 문화가 나타났다. 고유 문자인 가나가 쓰였고, 가나 문자로 쓴 장편 소설 『겐지 이야기』가 등장하였다.", "cite": "교과서 본문 재구성", "q": "위와 같은 문화가 나타난 시대의 모습으로 옳은 것은?", "o": ["다이카 개신이 단행되었다.", "헤이조쿄를 수도로 삼았다.", "장원을 바탕으로 귀족이 성장하고 무사 세력이 등장하였다.", "히미코가 야마타이국을 다스렸다.", "전방후원분이 처음 만들어졌다."], "a": 2, "e": "<b>헤이안 시대</b>에는 장원을 바탕으로 귀족이 성장했고, 귀족이 부린 <b>무사</b>가 세력을 키웠습니다. 문화 면에서는 <b>국풍 문화</b>(가나 문자, 와카)가 나타났습니다. ①은 아스카 시대, ②는 나라 시대, ④는 야요이 시대, ⑤는 야마토 정권기에 해당합니다."}, {"t": "『마누 법전』과 카스트", "p": "37쪽", "src": "창조주는 …… 브라만에게는 『베다』를 가르치며 제사 지내는 일을, 크샤트리아에게는 백성을 보호하고 다스릴 것을, 바이샤에게는 농사를 짓고 짐승을 기를 것을 명령하셨다. 마지막으로 수드라에게는 앞선 세 신분의 사람들에게 봉사하는 임무를 명령하셨다.", "cite": "『마누 법전』", "q": "위 법전이 힌두교도의 생활에 큰 영향을 주던 시기 왕조에 대한 설명으로 옳은 것은?", "o": ["산스크리트어가 공용어가 되고 칼리다사가 『샤쿤탈라』를 썼다.", "카니슈카왕이 대승 불교를 후원하였다.", "아소카왕이 칼링가 왕국을 정복하였다.", "알렉산드로스의 잔여 세력을 인더스강 유역에서 몰아냈다.", "동서 교역로를 장악하고 간다라 양식이 발달하였다."], "a": 0, "e": "<b>굽타 왕조</b> 때 힌두교가 발전하면서 <b>『마누 법전』</b>이 생활에 큰 영향을 주었고, 카스트제가 자리 잡았습니다. 이 시기에는 <b>산스크리트 문학</b>이 발달했습니다(『마하바라타』, 『라마야나』, 칼리다사). ②·⑤는 쿠샨 왕조, ③·④는 마우리아 왕조입니다."}, {"t": "간다라 양식", "p": "35쪽", "src": "불교 발생 초기에는 부처의 모습을 조각하는 것을 불경하다고 여겨 부처의 발자국, 보리수 나무, 연꽃 등으로 표현하였다. 그러나 (가) 문화가 유입된 후 곱슬머리, 오뚝한 코, 섬세한 옷 주름 등을 표현한 불상이 제작되었다.", "cite": "교과서 자료 1", "q": "위 미술 양식이 발달한 왕조에 대한 설명으로 옳은 것은?", "o": ["이란 계통의 쿠샨족이 세웠으며, 카니슈카왕 때 전성기를 누렸다.", "찬드라굽타 2세 때 벵골만까지 영토를 넓혔다.", "아잔타 석굴에 연화수 보살 벽화를 남겼다.", "『마누 법전』으로 카스트제를 정착시켰다.", "찬드라굽타 마우리아가 세웠다."], "a": 0, "e": "(가)는 <b>헬레니즘</b>입니다. 헬레니즘 문화와 인도 문화가 합쳐진 <b>간다라 양식</b>은 <b>쿠샨 왕조</b> 때 발달했습니다. ②·③·④는 굽타 왕조(③은 굽타 양식), ⑤는 마우리아 왕조입니다."}, {"t": "굽타 왕조", "p": "36쪽", "src": "이 석주에는 위대한 통치자가 정복 활동을 통해 그 명성이 전 세계에 아우르게 되었다고 기록되어 있다. …… 나 사무드라굽타는 탁월한 통치자의 반열에 오를 것임을 선포하노라.", "cite": "알라하바드 석주 비문", "q": "위 비문을 새긴 왕의 왕조에 대한 설명으로 옳은 것은?", "o": ["영(0)과 10진법을 사용하였다.", "상좌부 불교가 동남아시아로 전파되었다.", "푸르샤푸라를 중심으로 번영하였다.", "이슬람 세력에게 멸망하였다.", "왕의 길을 건설하였다."], "a": 0, "e": "사무드라굽타는 <b>굽타 왕조</b>의 왕입니다. 그는 <b>아소카왕의 석주</b>에 비문을 새겨 자신을 아소카왕과 같은 왕으로 내세웠습니다. 굽타 왕조 때는 <b>0과 10진법</b>, 원주율을 이용한 지구 둘레 추산 등 자연 과학이 발달했습니다. ②는 마우리아, ③은 쿠샨, ④는 사산 왕조, ⑤는 아케메네스 왕조에 해당합니다."}, {"t": "정통 칼리프 시대", "p": "43쪽", "src": "앞으로 제가 행사할 권한은 여러분에게 부여받은 것입니다. 제가 옳은 일을 하면 저를 도와주시고, 잘못된 일을 하면 바로잡아 주십시오.", "cite": "아부 바크르의 취임 연설", "q": "위 인물이 처음 칼리프가 되면서 시작된 시대에 대한 설명으로 옳은 것은?", "o": ["무함마드가 메카에서 메디나로 이동하였다.", "칼리프가 선출되었으며, 사산 왕조 페르시아를 멸망시켰다.", "조로아스터교를 국교로 삼았다.", "크테시폰을 중심으로 한과 로마 사이의 중계 무역을 하였다.", "다리우스 1세가 총독을 파견하였다."], "a": 1, "e": "무함마드가 죽은 뒤 <b>아부 바크르</b>부터 4대까지 칼리프를 선출한 시기를 <b>정통 칼리프 시대</b>라고 합니다. 이 시기에 사산 왕조를 멸망시켰습니다(651). ①은 헤지라(622)로 이 시기보다 앞서고, ③은 사산 왕조, ④는 파르티아, ⑤는 아케메네스 왕조에 해당합니다."}, {"t": "아테네 민주 정치", "p": "48쪽", "src": "우리의 정치 체제는 소수가 아닌 다수를 위한 것이기에 민주 정치라 부릅니다. …… 가난하다고 해서 정치에서 소외되지 않습니다.", "cite": "페리클레스의 추도 연설(투키디데스, 『펠로폰네소스 전쟁사』)", "q": "위 연설을 한 인물이 활동하던 시기 아테네의 모습으로 옳은 것은?", "o": ["호민관직과 평민회를 설치하였다.", "추첨제와 공무 수당제로 시민의 정치 참여를 넓혔다.", "헤일로타이를 두고 군국주의 체제를 유지하였다.", "12표법을 제정하였다.", "재산 정도에 따라 참정권을 처음 차등 부여하였다."], "a": 1, "e": "<b>페리클레스</b> 때 아테네 민주 정치가 전성기를 맞았습니다. 공직자를 <b>추첨</b>으로 뽑고 <b>공무 수당</b>을 지급해 가난한 시민도 정치에 참여할 수 있었습니다. 다만 여성·노예·외국인은 제외되었습니다. ①·④는 로마, ③은 스파르타, ⑤는 이보다 앞선 솔론의 개혁입니다."}, {"t": "프랑크 왕국", "p": "52쪽", "src": "이슬람 군대가 프랑크 왕국의 교회와 도시를 파괴하기 위해 투르를 향해 진군하였다. 이 위기의 순간에 궁재 카롤루스 마르텔이 군대의 선두에 서서 용맹하게 싸웠다.", "cite": "『생드니 연대기』", "q": "위 자료에 나타난 왕국에 대한 설명으로 옳은 것은?", "o": ["클로비스가 로마 가톨릭교(아타나시우스파)로 개종하였다.", "황제가 교회를 통제하는 황제 교황주의가 발달하였다.", "군관구제와 둔전병제를 실시하였다.", "키릴 문자를 사용하였다.", "성 소피아 성당을 건립하였다."], "a": 0, "e": "<b>프랑크 왕국</b>의 <b>클로비스</b>는 가톨릭으로 개종해 로마계 주민과의 갈등을 줄였습니다. <b>카롤루스 마르텔</b>은 투르·푸아티에 전투(732)에서 이슬람 세력을 물리쳤습니다. ②·③·⑤는 비잔티움 제국, ④는 슬라브족에 해당합니다."}, {"t": "봉건제", "p": "53쪽", "src": "기사 서임식에서 주군은 봉신의 오른쪽 발에 박차를 달아 주었다. …… 주군은 검을 집어 들어 기사의 허리에 채워 주며 그에게 입맞춤을 해주었다.", "cite": "크레티앵 드 트루아, 『그라알 이야기』", "q": "위 의식으로 맺어진 관계와 그 사회에 대한 설명으로 옳은 것은?", "o": ["주군과 봉신은 쌍무적 계약 관계를 맺었다.", "봉신은 주군에게 아무런 의무도 지지 않았다.", "농노는 영주의 허락 없이 자유롭게 장원을 떠날 수 있었다.", "장원의 경작지는 울타리를 쳐서 개별적으로 경작하였다.", "황제가 임명한 사령관이 군사권과 행정권을 함께 가졌다."], "a": 0, "e": "<b>주종제</b>에서 주군은 봉토를 주고 봉신을 보호했으며, 봉신은 충성과 군사적 봉사를 바쳤습니다. 이런 <b>쌍무적 계약</b> 관계였습니다. 농노에게는 거주 이전의 자유가 없었고, 경작지는 삼포제와 공동 경작을 위해 울타리를 치지 않았습니다. ⑤는 비잔티움의 군관구제입니다."}], "hard": [{"t": "동시대 · 로마와 중국", "p": "48쪽 · 연표", "src": "치열한 공방전 끝에 승리를 거둔 스키피오 장군은 철저하게 파괴된 카르타고의 최후 거점을 바라보았다. …… 아무리 강성한 국가라 하더라도 인간과 마찬가지로 쇠락의 순간에 직면한다는 사실을 말이다.", "cite": "폴리비오스, 『역사』", "q": "위 자료의 전쟁이 시작된 해(기원전 264)부터 이 장면에 이르는 시기, 중국에서 있었던 일로 옳은 것은?", "o": ["진이 전국 시대를 통일하고 군현제를 실시하였다.", "북위가 화북 지역을 통일하였다.", "수 양제가 대운하를 건설하였다.", "왕망이 신을 건국하였다.", "동진이 건강에 수도를 정하였다."], "a": 0, "e": "로마-카르타고 전쟁은 <b>기원전 264년</b>에 시작해 기원전 146년에 끝났습니다. 그 사이인 <b>기원전 221년</b>에 진이 중국을 통일했습니다. ②는 439년, ③은 7세기 초, ④는 기원후 8년, ⑤는 317년입니다."}, {"t": "동시대 · 헬레니즘과 인도", "p": "33·47쪽", "src": "기원전 334년 동방 원정에 나선 그는 페르시아를 무너뜨리고 인더스강 유역까지 진출하였다. 그는 정복지 곳곳에 자신의 이름을 딴 도시를 세웠다.", "cite": "교과서 본문 재구성", "q": "위 인물이 죽은 직후 인도에서 성립한 왕조에 대한 설명으로 옳은 것은?", "o": ["이 왕조의 왕이 칼링가 왕국을 정복하고 칙령을 새긴 석주를 세웠다.", "카니슈카왕이 중앙아시아까지 영토를 넓혔다.", "찬드라굽타 1세가 갠지스강 일대에서 건국하였다.", "에프탈의 침략으로 쇠퇴하였다.", "간다라 양식의 불상이 처음 만들어졌다."], "a": 0, "e": "기원전 4세기 <b>찬드라굽타 마우리아</b>가 알렉산드로스의 잔여 세력을 몰아내고 <b>마우리아 왕조</b>를 세웠습니다. 그의 손자 <b>아소카왕</b>은 칼링가를 정복하고 석주를 세웠습니다. ②·⑤는 쿠샨, ③·④는 굽타 왕조입니다."}, {"t": "동시대 · 그라쿠스 형제와 한", "p": "26·49쪽", "src": "티베리우스 그라쿠스는 군대에 복무한 대중의 이익을 위해 농지법을 제출하였다. …… 그는 반대파의 공격에 맞서 형제(가이우스)와 연대하면서 개혁을 관철시키려 하였다.", "cite": "카시우스 디오, 『로마사』", "q": "위 개혁이 추진되던 기원전 2세기 후반, 중국을 다스린 황제의 정책으로 옳은 것은?", "o": ["소금·철·술을 전매하고 오수전을 발행하였다.", "토지를 국유화하고 노비 매매를 금지하였다.", "수레바퀴의 폭을 통일하였다.", "흉노와 백등산에서 싸운 뒤 화친하였다.", "균전제를 처음 시행하였다."], "a": 0, "e": "그라쿠스 형제는 <b>기원전 2세기 후반</b>에 호민관으로 활동했습니다. 이때 중국은 <b>한 무제</b>(기원전 141년 즉위)의 시기로, 무제는 소금·철·술 <b>전매</b>와 균수법·평준법을 시행했습니다. ②는 왕망(1세기), ③은 진시황제, ④는 한 고조, ⑤는 북위입니다."}, {"t": "동시대 · 크리스트교 공인과 중국", "p": "28·51쪽", "src": "콘스탄티누스 대제는 칙령을 내려 크리스트교를 공인하였다. 이어 니케아에서 공의회를 열어 아타나시우스파의 교리를 정통으로 인정하였다.", "cite": "교과서 본문 재구성", "q": "위 사건들이 일어난 4세기 전반, 다른 지역의 상황으로 옳은 것은?", "o": ["중국에서 5호 16국 시대가 전개되었고, 강남에서는 동진이 세워졌다.", "당이 안사의 난으로 혼란에 빠졌다.", "무함마드가 이슬람교를 창시하였다.", "로마에서 그라쿠스 형제가 개혁을 추진하였다.", "진승·오광의 난이 일어났다."], "a": 0, "e": "밀라노 칙령은 <b>313년</b>, 니케아 공의회는 <b>325년</b>입니다. 중국은 5호 16국 시대가 시작되었고(304), <b>동진</b>이 건강에 세워졌습니다(317). 참고로 인도에서는 320년경 굽타 왕조가 성립했습니다. ②는 8세기, ③은 7세기, ④는 기원전 2세기, ⑤는 기원전 3세기입니다."}, {"t": "동시대 · 서로마 멸망 무렵", "p": "28·36·52쪽", "src": "게르만족 출신의 용병 대장 오도아케르가 황제를 폐위하면서 쇠약해진 서로마 제국이 멸망하였다.", "cite": "교과서 본문 재구성", "q": "위 사건이 일어난 5세기 후반 무렵, 다른 지역의 모습으로 옳은 것을 <보기>에서 고른 것은?\n\nㄱ. 북위 효문제가 균전제와 한화 정책을 추진하였다.\nㄴ. 굽타 왕조가 에프탈의 침략을 받아 쇠퇴하였다.\nㄷ. 카롤루스 대제가 서로마 황제로 대관되었다.\nㄹ. 한 무제가 장건을 서역에 파견하였다.", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 0, "e": "서로마는 <b>476년</b>에 멸망했습니다. 북위 효문제는 471년에 즉위했고(ㄱ), 굽타 왕조는 5세기 중엽 이후 <b>에프탈</b>의 침략으로 쇠퇴했습니다(ㄴ). ㄷ은 800년, ㄹ은 기원전 2세기의 일입니다."}, {"t": "동시대 · 성상 숭배 금지령과 당", "p": "30·54쪽", "src": "8세기 전반 비잔티움 제국의 황제 레오 3세가 성상 숭배 금지령을 내리자, 게르만족에게 포교하기 위해 성상이 필요하였던 로마 교회가 이를 거부하였다.", "cite": "교과서 본문", "q": "위 명령이 내려진 무렵(726) 중국 왕조의 상황으로 옳은 것은?", "o": ["현종 때 균전제가 무너지면서 부병제 대신 모병제가 시행되었다.", "수 문제가 남북조를 통일하였다.", "황건적의 난으로 후한이 흔들렸다.", "효문제가 뤄양으로 천도하였다.", "한 고조가 군국제를 실시하였다."], "a": 0, "e": "726년은 당 <b>현종</b>(재위 712~756) 때입니다. 이 무렵 인구 증가와 귀족·관료의 대토지 소유로 <b>균전제</b>가 무너졌고, 부병제 대신 <b>모병제</b>가 시행되었습니다. 이후 안사의 난(755)이 일어났습니다."}, {"t": "동시대 · 카롤루스 대제와 동아시아", "p": "30~31·52쪽 · 연표", "src": "교황 레오 3세는 비잔티움 제국 황제의 간섭에서 벗어나기 위해 카롤루스 대제를 서로마 황제로 대관하여 프랑크 왕국과 로마 가톨릭교회 사이의 유대를 다졌다.", "cite": "교과서 본문", "q": "위 사건(800) 전후 약 30년 사이, 동아시아에서 있었던 일로 옳은 것을 <보기>에서 고른 것은?\n\nㄱ. 당에서 양세법이 시행되었다.\nㄴ. 일본에서 헤이안 시대가 시작되었다.\nㄷ. 수가 남북조를 통일하였다.\nㄹ. 일본에서 다이카 개신이 시작되었다.", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 0, "e": "연표를 보면 양세법은 <b>780년</b>, 헤이안 시대의 시작은 <b>794년</b>입니다. ㄷ은 589년, ㄹ은 645년입니다."}, {"t": "동시대 · 쿠샨과 후한", "p": "26·35쪽", "src": "2세기 중엽 이 왕은 활발한 정복 전쟁을 벌여 북인도와 중앙아시아에 이르는 영토를 확보하였다. 그는 불교 지원과 포교에 힘썼으며, 그의 모습이 새겨진 금화가 전해진다.", "cite": "교과서 본문 재구성", "q": "위 왕이 활동하던 시기 중국의 모습으로 옳은 것은?", "o": ["후한이 뤄양을 수도로 삼았고, 채륜의 제지술이 보급되었다.", "당이 장안을 수도로 번영하였다.", "진시황제가 만리장성을 쌓았다.", "북위가 윈강 석굴을 만들었다.", "수가 과거제를 처음 시행하였다."], "a": 0, "e": "<b>카니슈카왕</b>(2세기 중엽)과 같은 시기 중국은 <b>후한</b>(25~220)이었습니다. 후한은 뤄양을 수도로 삼았고, 채륜이 제지술을 개량했습니다(105). 쿠샨 왕조 때 발달한 대승 불교가 사막길을 거쳐 이 무렵 중국에 전해졌습니다."}, {"t": "추론 · 동진 승려의 인도 여행", "p": "29·37쪽", "src": "동진의 승려 법현은 불경을 구하려고 장안을 떠나 인도로 향하였다. 그가 도착한 나라에서는 산스크리트 문학이 번성하였으며, 궁정 시인이 『샤쿤탈라』를 지었다고 한다.", "cite": "교과서 내용 재구성", "q": "법현이 방문한 인도 왕조에 대한 설명으로 옳은 것은?", "o": ["브라흐마·비슈누·시바를 섬기는 힌두교가 발전하였다.", "칼링가 왕국을 정복한 뒤 불교로 나라를 다스렸다.", "동서 교역로를 장악해 중계 무역으로 번영하였다.", "사산 왕조의 세력 확대로 쇠퇴하였다.", "알렉산드로스의 잔여 세력을 몰아내고 건국하였다."], "a": 0, "e": "『샤쿤탈라』의 칼리다사는 <b>찬드라굽타 2세</b>의 궁정 시인이므로 이 나라는 <b>굽타 왕조</b>입니다. 동진(317~420)과도 시기가 맞습니다. 굽타 왕조 때 힌두교가 발전했습니다. ②·⑤는 마우리아, ③·④는 쿠샨 왕조입니다."}, {"t": "추론 · 한 인물, 두 평가", "p": "56쪽", "src": "(가) 대군을 이끌고 이탈리아반도, 시칠리아, 북아프리카 일대를 평정하여 …… 우리는 가는 곳마다 위대한 제국의 황금시대가 도래하였다는 칭송을 받았다. - 『전쟁에 대하여』\n(나) 지혜롭던 황제는 아첨꾼들의 농락에 넘어가 …… 온갖 악행을 저질렀다. …… 신의 징벌로 말미암아 큰 역병이 창궐하였으니 - 『비사』", "cite": "프로코피우스", "q": "(가), (나)를 탐구한 내용으로 옳지 않은 것은?", "o": ["같은 저자가 같은 황제를 서로 다르게 평가하였다.", "역사 서술은 서술 목적이나 공개 여부에 따라 달라질 수 있다.", "이 황제 때 제국은 영토를 넓혔지만 전염병으로 인구가 크게 줄었다.", "이 황제는 『유스티니아누스 법전』을 편찬하였다.", "이 황제는 사산 왕조의 침입에 대비해 제국을 4개로 나누어 통치하였다."], "a": 4, "e": "두 자료 모두 <b>유스티니아누스 황제</b>에 대한 기록입니다. 제국을 넷으로 나눈 황제는 로마의 <b>디오클레티아누스</b>입니다. 사산 왕조에 대비해 <b>군관구제</b>를 실시한 것은 유스티니아누스 <b>사후</b>의 일이므로 ⑤는 옳지 않습니다."}, {"t": "추론 · 교황의 두 편지", "p": "54쪽", "src": "(가) (파사우의 주교에게) 나의 아들 하인리히 4세가 파견한 사절단이 …… 성직자 서임권에 관한 교황의 권위를 부정하는 황제의 서한을 낭독하였소. - 아그네스 황후\n(나) (국왕 윌리엄에게) 새로운 주교는 이미 교황청의 권위에 온전히 순종하겠다는 서약을 하였으니, 당신도 교회의 결정에 따른다면 신의 큰 은총을 입을 것이오. - 교황 그레고리우스 7세", "cite": "교과서 자료 1, 2", "q": "(가), (나)를 통해 추론한 내용으로 가장 적절한 것은?", "o": ["교황은 서임권 문제에서 모든 세속 군주에게 똑같이 강경하게 대응하였다.", "교황은 여러 군주와 서임권 문제로 갈등했지만, 상대에 따라 대응 방식을 달리하였다.", "두 자료 이후 황제가 성직자 서임권을 완전히 되찾았다.", "윌리엄은 비잔티움 제국의 황제였다.", "두 자료는 성상 숭배 문제를 둘러싼 동서 교회의 대립을 보여 준다."], "a": 1, "e": "그레고리우스 7세는 하인리히 4세와 정면으로 부딪쳐 그를 파문했지만(→ <b>카노사의 굴욕</b>), 노르만 왕조를 세운 <b>윌리엄 정복왕</b>에게는 <b>유화적인 태도</b>를 보였습니다. 이후 <b>보름스 협약</b>(1122)으로 서임권은 교황에게 돌아갔습니다."}, {"t": "추론 · 키케로의 시선", "p": "49쪽", "src": "과거 우리 로마가 카르타고와의 전쟁에서 승리한 이후, 그라쿠스 형제는 농지법을 통해 공유지를 소멸시키고 각종 선심성 정책을 펼쳐 국고를 고갈시키려 하였다. …… 이들의 파멸은 바로 가진 자의 것을 빼앗아 공화정의 화합을 파괴하려는 분쟁에서 기인한 것이었다.", "cite": "키케로, 『농지법에 관하여』", "q": "위 자료에 대한 해석으로 가장 적절한 것은?", "o": ["키케로는 그라쿠스 형제의 개혁을 긍정적으로 평가하였다.", "키케로는 카이사르의 개혁을 그라쿠스 형제에 빗대어 비판하였다.", "이 글은 5현제 시기에 쓰였다.", "키케로는 라티푼디움을 해체해야 한다고 주장하였다.", "이 글은 로마-카르타고 전쟁 이전의 상황을 비판한 것이다."], "a": 1, "e": "교과서 설명처럼 키케로는 제1차 삼두 정치 시기 <b>카이사르</b>가 농지법 등 개혁을 추진하자, 그를 과거의 <b>그라쿠스 형제</b>처럼 국가 재정을 고갈시키려 한다고 비판했습니다. 시기는 공화정 말기로, 5현제보다 앞섭니다."}, {"t": "추론 · 아테네와 로마 비교", "p": "45·48쪽", "src": "A: (가)에서는 거주지를 기준으로 부족을 나누고 500인 평의회를 두었으며, 도편 추방제를 실시하였어.\nB: (나)에서는 평민의 요구를 받아들여 호민관직을 설치하였고, 평민회의 결의가 원로원의 승인 없이도 법적 효력을 갖게 되었지.", "cite": "수업 대화 재구성", "q": "(가), (나)에 대한 설명으로 옳은 것은?", "o": ["(가) – 12표법을 제정하였다.", "(가) – 델로스 동맹의 맹주가 되었다.", "(나) – 피정복민을 헤일로타이로 삼았다.", "(나) – 페르시아와의 살라미스 해전에서 승리하였다.", "(가)와 (나) – 알렉산드로스 사후 이집트 왕국으로 분열되었다."], "a": 1, "e": "(가)는 클레이스테네스가 개혁한 <b>아테네</b>, (나)는 <b>로마 공화정</b>입니다. 아테네는 그리스·페르시아 전쟁 뒤 <b>델로스 동맹</b>의 맹주가 되었습니다. ①은 로마, ③은 스파르타, ④는 아테네 중심의 그리스 연합군이 거둔 승리입니다."}, {"t": "추론 · 순서 배열", "p": "52·54쪽", "src": "(가) 황제 하인리히 4세가 카노사에서 교황에게 용서를 구하였다.\n(나) 비잔티움 황제 레오 3세가 성상 숭배 금지령을 내렸다.\n(다) 교황 레오 3세가 카롤루스 대제에게 서로마 황제의 관을 씌웠다.\n(라) 보름스 협약으로 교황이 성직자 서임권을 갖게 되었다.", "cite": "교과서 내용 재구성", "q": "(가)~(라)를 일어난 순서대로 바르게 나열한 것은?", "o": ["(나) – (다) – (가) – (라)", "(다) – (나) – (가) – (라)", "(나) – (가) – (다) – (라)", "(다) – (가) – (나) – (라)", "(가) – (나) – (라) – (다)"], "a": 0, "e": "(나) 성상 숭배 금지령 <b>726</b> → (다) 카롤루스 대관 <b>800</b> → (가) 카노사의 굴욕 <b>1077</b> → (라) 보름스 협약 <b>1122</b> 순서입니다."}, {"t": "추론 · 십자군과 스콜라 철학", "p": "55쪽", "src": "제4차 십자군의 콘스탄티노폴리스 점령 이후 서유럽 지식인들은 고대 그리스 문헌과 직접 접촉할 수 있는 기회를 얻게 되었다. …… 학자 빌럼은 아퀴나스를 만나, 아랍어를 라틴어로 번역한 아리스토텔레스의 저작물에는 오류가 많으므로 그리스어 원전을 직접 번역하며 연구해야 한다고 강조하였다.", "cite": "프랭크 매길, 『중세 시대』", "q": "위 자료를 바탕으로 추론한 내용으로 옳지 않은 것은?", "o": ["비잔티움 제국은 그리스 고전을 보존해 서유럽 학문에 영향을 주었다.", "그 이전에는 서유럽이 아리스토텔레스 저작을 주로 이슬람 세계를 거쳐 접하였다.", "아퀴나스는 『신학 대전』으로 신앙과 이성의 조화를 꾀하였다.", "십자군 전쟁은 동서 문화 교류를 촉진하는 결과를 낳았다.", "이 시기 서유럽 학문은 신학에서 완전히 벗어나 교부 철학을 대체하였다."], "a": 4, "e": "<b>스콜라 철학</b>은 크리스트교 신앙을 합리적으로 이해하려는 학문으로, 신학을 중심에 두었습니다. 따라서 '신학에서 완전히 벗어났다'는 ⑤는 틀렸습니다. 비잔티움은 <b>그리스어</b>를 공용어로 삼고 고전을 보존했습니다."}], "sa": [{"q": "진시황제가 사상을 통제하려고 실용서를 제외한 책을 불태우고 유학자들을 산 채로 묻은 사건은?", "a": ["분서갱유"], "p": "25쪽"}, {"q": "수 문제가 문벌 귀족의 관직 독점을 막기 위해 시행한, 시험으로 관리를 선발하는 제도는?", "a": ["과거제", "과거"], "p": "29쪽"}, {"q": "안사의 난 이후 당이 양염의 건의로 시행한, 가구의 자산에 따라 여름과 가을 두 번 세금을 거둔 제도는?", "a": ["양세법"], "p": "30쪽"}, {"q": "아테네에서 참주가 될 위험이 있는 인물의 이름을 도자기 조각에 적어 투표로 추방한 제도는?", "a": ["도편추방제", "도편추방", "오스트라키스모스"], "p": "45쪽"}, {"q": "로마 최초의 성문법으로, 이후 시민법·만민법으로 발전한 법은?", "a": ["12표법", "십이표법"], "p": "48·51쪽"}, {"q": "굽타 왕조 시기 카스트제를 비롯한 각종 의례와 관습을 기록해 힌두교도의 일상생활에 크게 영향을 준 법전은?", "a": ["마누법전", "마누"], "p": "36쪽"}, {"q": "쿠샨 왕조 때 헬레니즘 문화와 인도 문화가 융합되어 발달한 불교 미술 양식은?", "a": ["간다라양식", "간다라"], "p": "35쪽"}, {"q": "622년 무함마드가 박해를 피해 메카에서 메디나로 옮겨 간 사건을 무엇이라 하는가?", "a": ["헤지라"], "p": "43쪽"}, {"q": "비잔티움 제국에서 절대적 권위를 가진 황제가 교회를 통치 대상으로 삼아 통제한 체제는?", "a": ["황제교황주의"], "p": "56쪽"}, {"q": "장원의 경작지를 춘경지·추경지·휴경지로 나누어 돌아가며 경작한 농법은?", "a": ["삼포제", "삼포식농법"], "p": "53쪽"}]};const N=['①','②','③','④','⑤'];
const S={ox:'⭕❌ OX 10',mc:'📝 5지선다 25',hard:'🔥 고난도 15',sa:'✍️ 주관식 10'};
let cur='ox',i=0,A={};for(const k in D)A[k]=Array(D[k].length).fill(null);try{const sv=JSON.parse(localStorage.getItem('wh60'));if(sv)for(const k in D)if(sv[k]&&sv[k].length==D[k].length)A[k]=sv[k]}catch(e){}
const norm=s=>s.replace(/[\s·()（）『』「」]/g,'').replace(/[Ⅻ]/g,'12').toLowerCase();
function correct(k,j){const q=D[k][j],a=A[k][j];if(a===null)return null;if(k=='sa')return q.a.some(x=>norm(x)==norm(a));return a===q.a}
function tabs(){tabsEl.innerHTML=Object.keys(S).map(k=>`<button class="${k==cur?'on':''}" onclick="cur='${k}';i=0;r()">${S[k]}</button>`).join('')}
const tabsEl=document.getElementById('tabs');
function r(){try{localStorage.setItem('wh60',JSON.stringify(A))}catch(e){};window.scrollTo(0,0);tabs();const L=D[cur],q=L[i],a=A[cur][i],app=document.getElementById('app');
bar.style.width=(A[cur].filter(x=>x!==null).length/L.length*100)+'%';cnt.textContent=`${S[cur].slice(0,-3)} · 문항 ${i+1} / ${L.length}`;
jump.innerHTML=L.map((_,j)=>{const c=correct(cur,j);return `<span class="${c===true?'c':c===false?'w':''} ${j==i?'cur':''}" onclick="i=${j};r()">${j+1}</span>`}).join('');
let h=`<span class="tag">${q.t?q.t+' · ':''}교과서 ${q.p}</span>`;
if(q.src)h+=`<div class="src">${q.src}<small>- ${q.cite} -</small></div>`;
if(cur=='ox'){h+=`<div class="q">${i+1}. ${q.q}</div><div class="oxrow"><button class="opt" data-k="1">O</button><button class="opt" data-k="0">X</button></div>`}
else if(cur=='sa'){h+=`<div class="q">${i+1}. ${q.q}</div><input class="sa" id="inp" placeholder="정답을 입력하고 Enter" ${a!==null?'disabled':''} value="${a??''}"><div style="margin-top:8px"><button class="b" id="chk" ${a!==null?'disabled':''}>제출</button></div>`}
else{h+=`<div class="q">${i+1}. ${q.q}</div>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${N[k]} ${o}</button>`).join('')}
h+=`<div class="exp" id="exp"></div><div class="nav"><button class="b" id="pv" ${i?'':'disabled'}>← 이전</button><button class="b" id="nx">${i==L.length-1?'결과 보기':'다음 →'}</button></div>`;
app.innerHTML=h;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(A[cur][i]===null){A[cur][i]=+b.dataset.k;r()}});
if(cur=='sa'){const sub=()=>{const v=inp.value.trim();if(v){A.sa[i]=v;r()}};chk.onclick=sub;inp.onkeydown=e=>{if(e.key=='Enter')sub()};if(a===null)inp.focus()}
if(a!==null){const ok=correct(cur,i);
 if(cur!='sa')app.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;b.disabled=true;if(k==q.a)b.classList.add('ok');else if(k==a)b.classList.add('no')});
 exp.style.display='block';const ans=cur=='sa'?q.a[0]:cur=='ox'?(q.a?'O':'X'):N[q.a];
 exp.innerHTML=(ok?'⭕ 정답입니다! ':'❌ 오답입니다. 정답: <b>'+ans+'</b>')+(q.e?'<br>'+q.e:'')}
pv.onclick=()=>{i--;r()};nx.onclick=()=>{if(i<L.length-1){i++;r()}else res()}}
function res(){const L=D[cur];const s=L.filter((_,j)=>correct(cur,j)).length;bar.style.width='100%';cnt.textContent='결과 · '+S[cur].slice(0,-3);jump.innerHTML='';
app.innerHTML=`<div class="res"><p>나의 점수</p><h2>${s} / ${L.length}</h2><p>${s>=L.length*.9?'훌륭해요! 🎉':s>=L.length*.6?'좋아요! 틀린 문항만 복습해 봐요.':'교과서 자료를 다시 읽어 봅시다.'}</p><ul>${L.map((q,j)=>{const c=correct(cur,j);return `<li onclick="i=${j};r()">${c?'⭕':c===false?'❌':'⬜'} ${j+1}. ${q.t||q.q.slice(0,34)+'…'}</li>`}).join('')}</ul><button class="b" onclick="A[cur]=Array(D[cur].length).fill(null);i=0;r()">이 유형 다시 풀기</button></div>`}
r();
